name: Lock workflow actions

# Pins every action used by this repository's workflows to an exact commit and
# records it in .github/workflows/actions.lock (GitHub's workflow lockfile), so
# a changed or hijacked action cannot run with this repository's secrets.
#
# Run it again after adding a workflow or changing any `uses:` line. The job
# cannot save the result itself (GitHub forbids jobs from changing files in
# .github/workflows), so it prints a patch for someone to commit.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install GitHub's lockfile tool
        run: gh extension install github/gh-actions-lock

      - name: Write the lockfile
        run: gh actions-lock

      - name: Show what changed
        run: |
          git add -A .github/workflows
          git status --short
          echo "-----BEGIN LOCK PATCH-----"
          git diff --cached --binary | base64 -w 76
          echo "-----END LOCK PATCH-----"

      - name: Say whether the lockfile needs updating
        run: |
          if git diff --cached --quiet; then
            echo "The lockfile is up to date."
          else
            echo "::warning::The lockfile needs updating. GitHub does not let a job change files in .github/workflows, so the patch printed in the step above has to be committed by a person (or by Claude in a session with this repository)."
          fi
