name: Publish teammates

# Creates or updates the nine teammates and their sandbox on Claude Managed Agents,
# then saves their IDs in kit/voice-crew-team/claude-lock.json so the next run
# updates the same teammates instead of making duplicates.
#
# Needs one repository secret named ANTHROPIC_API_KEY
# (repository Settings > Secrets and variables > Actions > New repository secret).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kit/voice-crew-team/agents/**"
      - "kit/voice-crew-team/environment.yaml"

permissions:
  contents: write

concurrency:
  group: publish-teammates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kit/voice-crew-team
    env:
      FILES: >-
        agents/michael.md agents/mia.md agents/leo.md agents/jimmy.md
        agents/raphaella.md agents/jason.md agents/sara.md agents/freya.md
        agents/martina.md environment.yaml
    steps:
      - uses: actions/checkout@v4.4.0

      # Finds the Claude key inside whatever was pasted into the secret, checks that
      # Claude accepts it, and hands it to the later steps. It never prints any part
      # of the secret: only its size and what kind of thing it looks like.
      - name: Check the key
        env:
          SAVED_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          raw="$SAVED_SECRET"
          packed="$(printf '%s' "$raw" | tr -d '[:space:]')"
          if [ -z "$packed" ]; then
            echo "::error::Add your Claude Console key as a repository secret named ANTHROPIC_API_KEY, then run this again."
            exit 1
          fi

          # A Claude key is the part that starts with sk-ant-. Look for it with line
          # breaks closed up (a key wrapped over two lines), then exactly as pasted
          # (a key with other text after it).
          first="$(printf '%s' "$packed" | LC_ALL=C grep -o 'sk-ant-[A-Za-z0-9_-]*' | head -n 1 || true)"
          second="$(printf '%s' "$raw" | LC_ALL=C grep -o 'sk-ant-[A-Za-z0-9_-]*' | head -n 1 || true)"

          if [ -z "$first" ]; then
            lines="$(printf '%s\n' "$raw" | grep -c '[^[:space:]]' || true)"
            case "$packed" in
              samsara_api_*) kind="a Samsara token" ;;
              sk-*) kind="a key from another AI service (it starts with sk- but not sk-ant-)" ;;
              ghp_*|gho_*|github_pat_*) kind="a GitHub token" ;;
              AIza*) kind="a Google key" ;;
              http*) kind="a web address" ;;
              ANTHROPIC*|anthropic*|Anthropic*) kind="the name ANTHROPIC_API_KEY typed where the key itself should go" ;;
              *@*) kind="an email address" ;;
              *) kind="something that is not a key from any service this job recognises" ;;
            esac
            echo "::error::The saved secret has no Claude Console key in it (those start with sk-ant-). It holds ${#packed} characters on $lines line(s) and looks like $kind. In the Claude Console create a key, copy it with the copy button, and put only that in the ANTHROPIC_API_KEY secret."
            exit 1
          fi

          ask() {
            curl -sS -o /dev/null -w '%{http_code}' 'https://api.anthropic.com/v1/models?limit=1' \
              -H 'anthropic-version: 2023-06-01' -H @<(printf 'x-api-key: %s' "$1") || true
          }
          key="$first"
          echo "::add-mask::$key"
          code="$(ask "$key")"
          if [ "$code" != "200" ] && [ -n "$second" ] && [ "$second" != "$first" ]; then
            echo "::add-mask::$second"
            code2="$(ask "$second")"
            if [ "$code2" = "200" ]; then key="$second"; code="$code2"; fi
          fi
          case "$code" in
            200) ;;
            401|403)
              echo "::error::Claude did not accept the saved key (answer $code). The key found is ${#key} characters long. It may be cut short, mistyped or deleted. Create a new key in the Claude Console and update the ANTHROPIC_API_KEY secret."
              exit 1 ;;
            *)
              echo "::error::Could not check the key: Claude's service answered $code. Run this again in a few minutes."
              exit 1 ;;
          esac
          if [ "$key" != "$raw" ]; then
            echo "::notice::The saved secret has extra spaces, line breaks or text around the key. They are ignored."
          fi
          umask 077
          printf '%s' "$key" > "$RUNNER_TEMP/claude-key"
          echo "The key works."

      - uses: actions/setup-go@v5.6.0
        with:
          go-version: stable
          cache: false

      - name: Install the ant tool
        run: |
          go install github.com/anthropics/anthropic-cli/v2/cmd/ant@v2.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Show the plan
        run: |
          export ANTHROPIC_API_KEY="$(cat "$RUNNER_TEMP/claude-key")"
          ant apply --dry-run $FILES

      - name: Publish
        run: |
          export ANTHROPIC_API_KEY="$(cat "$RUNNER_TEMP/claude-key")"
          ant apply --yes $FILES

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/claude-key"

      - name: Keep a copy of the IDs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: claude-lock
          path: kit/voice-crew-team/claude-lock.json
          if-no-files-found: ignore

      - name: Save the IDs in the repository
        run: |
          if [ ! -f claude-lock.json ]; then
            echo "::error::Publishing did not write claude-lock.json."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-lock.json
          if git diff --cached --quiet; then
            echo "IDs unchanged."
          else
            git commit -m "Record teammate IDs"
            git push || { git pull --rebase && git push; }
          fi

      - name: List the settings for the server
        run: |
          {
            echo "### Settings to enter on the server"
            echo
            echo "These are IDs, not secrets."
            echo
            echo '```'
            jq -r '.resources | to_entries[]
              | (.key | split("/") | last | sub("\\.(md|yaml)$"; "") | ascii_upcase) as $n
              | if $n == "ENVIRONMENT" then "ENVIRONMENT_ID=\(.value.id)" else "AGENT_ID_\($n)=\(.value.id)" end' \
              claude-lock.json || cat claude-lock.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
